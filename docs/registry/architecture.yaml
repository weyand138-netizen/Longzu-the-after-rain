version: 1
registry_owner: architecture
last_updated: 2026-08-10

state_ownership:
  - name: candidate_identity
    owner: SYS-BUILD
    contract: candidate_manifest:v1
    source: docs/architecture/adr-0007-sys-build-contract-closure.md
    status: accepted
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: release_identity
    owner: SYS-BUILD
    contract: release_identity:v1
    source: docs/architecture/adr-0007-sys-build-contract-closure.md
    status: accepted
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

interfaces:
  - name: narrative_flow_manifest
    schema: narrative_flow_manifest:v1
    owner: SYS-NARRATIVE
    source: docs/architecture/adr-0008-choice-narrative-content-lock.md
    status: accepted
    consumers:
      - SYS-BUILD
      - SYS-TEST
    required_fields:
      - unit_id
      - source_hash
      - node_id
      - canonical_choice_id
      - immediate_reaction_id
      - delayed_payoff_id
      - successor_node_ids
      - terminal_entry_id
      - witness_ids
    referenced_by:
      - SYS-CHOICE
      - SYS-NARRATIVE
      - SYS-BUILD
      - SYS-TEST

  - name: runner_capability
    schema: engine-capability-manifest:v1
    owner: Engine Reference / SYS-BUILD
    source: docs/engine-reference/renpy/capability-manifest-v1.json
    status: accepted
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: narrative_partial_day1_manifest
    schema: narrative_partial_day1_manifest:v1
    owner: SYS-NARRATIVE
    source: docs/architecture/adr-0009-partial-day1-manifest-and-handoff-boundary.md
    status: accepted
    consumers:
      - Sprint-001 validation
    required_fields:
      - artifact_kind
      - source_unit_id
      - source_hash
      - node_id
      - canonical_choice_id
      - immediate_reaction_id
      - delayed_payoff_id
      - successor_node_ids
      - day1_handoff_node_id
      - witness_ids
      - full_production_manifest
      - terminal_witness_coverage
    referenced_by:
      - SYS-NARRATIVE
      - SYS-CHOICE
      - SYS-BUILD
      - SYS-TEST

  - name: candidate_manifest
    schema: candidate_manifest:v1
    owner: SYS-BUILD
    source: docs/architecture/adr-0007-sys-build-contract-closure.md
    status: accepted
    consumers:
      - SYS-TEST
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: test_evidence_bundle
    schema: test_evidence_bundle:v1
    owner: SYS-TEST
    source: design/gdd/sys-test.md
    status: accepted
    binding:
      required_candidate_field: candidate_identity
      required_final_field: archive_hash
      stages:
        - STAGING_EVIDENCE_BOUND
        - ARCHIVE_EVIDENCE_BOUND
    referenced_by:
      - SYS-TEST
      - SYS-BUILD

  - name: exclusion_reports
    schema:
      - staging_exclusion_report:v1
      - archive_exclusion_report:v1
    owner: SYS-TEST
    consumer: SYS-BUILD
    source: docs/architecture/adr-0007-sys-build-contract-closure.md
    status: accepted
    required_zero_counts:
      - test_only
      - production_to_test_only_edge
      - network_dependency
      - telemetry_entry
      - undeclared_asset
      - unallowlisted_asset
    referenced_by:
      - SYS-TEST
      - SYS-BUILD

api_decisions:
  - name: canonical_encoding
    schema: canonical_encoding:v1
    value: UTF-8-no-BOM-LF-canonical-JSON
    owner: Architecture
    source: docs/architecture/adr-0007-sys-build-contract-closure.md
    status: accepted
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: archive_hash
    algorithm: SHA-256
    representation: lowercase-64-hex
    input: exact-final-package-bytes-only
    owner: SYS-BUILD
    source: docs/architecture/adr-0007-sys-build-contract-closure.md
    status: accepted
    self_reference: forbidden
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: build_config_identity_split
    schema: identity_affecting_build_config:v1
    owner: SYS-BUILD
    source: docs/architecture/adr-0007-sys-build-contract-closure.md
    status: accepted
    identity_affecting:
      - build_mode
      - target_platform
      - package_selection
      - package_format
      - archive_policy
      - byte_or_semantic_build_options
    run_only:
      - workspace_path
      - output_location
      - log_level
      - timeout
      - diagnostic_retention_runs
      - build_run_id
      - timestamps
    rule: only identity-affecting changes stale candidate_identity
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: release_artifact_layout
    schema: candidate_manifest:v1
    value: production/releases/<candidate_identity>/ with manifest siblings and archive/
    owner: SYS-BUILD
    source: docs/architecture/adr-0007-sys-build-contract-closure.md
    status: accepted
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

forbidden_patterns:
  - name: narrative_local_causality_authority
    rule: narrative labels may not invent canonical choice IDs, reaction/payoff joins, or terminal witnesses outside SYS-CHOICE and narrative_flow_manifest:v1
    source: docs/architecture/adr-0008-choice-narrative-content-lock.md
    status: accepted

  - name: archive_hash_self_reference
    rule: candidate_identity and archive_hash must not hash a manifest or directory that contains the same hash
    source: docs/architecture/adr-0007-sys-build-contract-closure.md
    status: accepted

  - name: partial_day1_manifest_production_promotion
    rule: narrative_partial_day1_manifest:v1 must not be accepted by a full production-manifest, terminal-witness, SYS-BUILD admission, or release validator
    source: docs/architecture/adr-0009-partial-day1-manifest-and-handoff-boundary.md
    status: accepted

  - name: production_to_test_only_dependency
    rule: production source, staging, archive, formal save, or persistent payload must not depend on test-only code or data
    source: docs/architecture/adr-0007-sys-build-contract-closure.md
    status: accepted

  - name: evidence_cross_generation_merge
    rule: evidence from different candidate identities or identity generations must not be concatenated
    source: docs/architecture/adr-0007-sys-build-contract-closure.md
    status: accepted

  - name: implicit_canonical_encoding
    rule: native serializer output, platform path ordering, locale collation, floats, timestamps, or implicit defaults must not enter identity hashes
    source: docs/architecture/adr-0007-sys-build-contract-closure.md
    status: accepted
