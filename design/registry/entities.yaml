    source: design/gdd/save-load-rollback.md
    expression: >-
      allowed_phase(phase, action) and gate_profile[action].visible and
      gate_profile[action].enabled and gate_profile[action].focusable
    variables:
      - phase
      - action
      - gate_profile
    output: exact_bool
    stable_phase_actions:
      - manual_save
      - quick_save
      - auto_save
      - load
      - quick_load
      - rollback
    main_menu_actions:
      - load
      - quick_load
    denied_phases:
