    starts_after_safe_presentation_boundary: true
    load_rollback_exit_cancels: true
    referenced_by:
      - SYS-ACHIEVE
      - SYS-ACCESS
      - SYS-TEST

  - name: notification_transition_ms
    kind: tuning_knob
    source: design/gdd/local-achievements.md
