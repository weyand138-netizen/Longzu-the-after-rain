  - name: test_nearest_rank_percentile
    kind: formula
    source: design/gdd/sys-test.md
    expression: "sort(X)[ceil(canonical_rational_p * len(X)) - 1]"
    variables:
      - raw_samples
      - percentile
      - canonical_rational_percentile
      - sample_count
      - rank
    output: finite_sample_value
    interpolation: forbidden
    invalid_sample_policy: reject_protocol
    referenced_by:
      - SYS-TEST

  - name: test_performance_pass
    kind: formula
    source: design/gdd/sys-test.md
    expression: "protocol_valid and nonempty_approved_thresholds and all_metric_comparisons_pass"
    variables:
      - protocol_valid
      - approved_comparisons
      - measured_metrics
      - comparison_operators
      - approved_thresholds
    output: exact_bool
    threshold_owner: owning_gdd
    missing_threshold_result: REPORT_ONLY
    referenced_by:
      - SYS-TEST

  - name: test_evidence_bundle_v1
    kind: schema
    source: design/gdd/sys-test.md
    generation_id: "test_evidence_bundle:v1"
    value:
      - bundle_schema_version
      - run_id
      - scope
      - criterion_id
      - owner_system
      - suite_id
      - expected_case_ids
      - executed_case_ids
      - fixture_manifest_id
      - oracle_id
      - matrix_cell_ids
      - expected_case_count
       - required_evidence_types
       - identity_generation
       - evidence_stage
       - candidate_manifest_id_hash
       - candidate_identity
       - archive_hash
       - artifact_ids
      - source_catalog_config_fixture_runner_environment_hashes
      - source_inventory_id_hash
      - protocol_manifest_id_hash
      - threshold_manifest_id_hash
      - capture_protocol
      - provider_approval
      - canonical_artifact_path
      - raw_output_references
      - criterion_results
      - blocked_input_reason_codes
      - failure_and_finding_ids
      - exit_codes
       - unresolved_blocking_findings
       - exclusion_report_id_hash
    owner_system: SYS-TEST
    provisional: false
    acceptance_adr: ADR-0007
    evidence_stages:
      - STAGING_EVIDENCE_BOUND
      - ARCHIVE_EVIDENCE_BOUND
    referenced_by:
      - SYS-TEST

  - name: candidate_manifest_v1
    kind: schema
    source: design/gdd/sys-build.md
    generation_id: "candidate_manifest:v1"
    value:
      - schema
      - candidate
      - inputs
      - engine_capability
      - artifact_layout
      - evidence_contract
      - legal_closure
      - archive
      - provenance
    candidate_identity_excludes:
      - build_run_id
      - timestamp
      - archive_bytes
      - archive_hash
      - manifest_hash
      - provenance_hash
      - release_identity
    owner_system: SYS-BUILD
    acceptance_adr: ADR-0007
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: canonical_encoding_v1
    kind: encoding_contract
    source: design/gdd/sys-build.md
    generation_id: "canonical_encoding:v1"
    text_encoding: UTF-8_without_BOM
    line_endings: LF
    structured_format: canonical_JSON
    key_order: lexicographic
    path_order: UTF8_byte_order_with_slash_separator
    allowed_identity_values: [null, boolean, exact_integer, string, array, object]
    forbidden_identity_values: [float, NaN, infinity, timestamp, implicit_default]
    acceptance_adr: ADR-0007
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: archive_hash
    kind: formula
    source: design/gdd/sys-build.md
    expression: "SHA256(exact_final_package_bytes_only)"
    algorithm: SHA-256
    output: lowercase_sha256_64hex
    manifest_inside_archive: forbidden
    self_reference: forbidden
    acceptance_adr: ADR-0007
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: release_identity
    kind: formula
    source: design/gdd/sys-build.md
    expression: "SHA256(canonical_bytes_v1(candidate_identity, archive_hash, manifest_hash, provenance_hash, legal_closure_hash, evidence_hashes, exclusion_report_hashes))"
    candidate_identity_input: forbidden
    output: lowercase_sha256_64hex
    acceptance_adr: ADR-0007
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: diagnostic_repeat_count
    kind: tuning_knob
    source: design/gdd/sys-test.md
    target: 3
    safe_range: [2, 10]
    unit: diagnostic_repeats
    pass_override: forbidden
    referenced_by:
      - SYS-TEST

  - name: current_artifact_retention_generations
    kind: tuning_knob
    source: design/gdd/sys-test.md
    target: 10
    safe_range: [3, 50]
    unit: input_generations
    release_artifact_deletion: forbidden
    referenced_by:
      - SYS-TEST

  - name: fast_gate_feedback_target_seconds
    kind: tuning_knob
    source: design/gdd/sys-test.md
    target: 120
    safe_range: [30, 300]
    unit: seconds
    over_target_result: workflow_warning_only
    required_case_reduction: forbidden
    referenced_by:
      - SYS-TEST

  - name: sys_test_acceptance_criteria_count
    kind: constant
    source: design/gdd/sys-test.md
    value: 66
    unit: criterion_ids
    unique_ids_required: true
    referenced_by:
      - SYS-TEST

  - name: candidate_identity
    kind: formula
    source: design/gdd/sys-build.md
    expression: "SHA256(canonical_bytes_v1(source_identity, bundle_identity, engine_capability, identity_affecting_build_config, legal_asset_inventory))"
    variables:
       - source_identity
      - bundle_identity
      - engine_capability
      - identity_affecting_build_config
      - legal_asset_inventory
    output: lowercase_sha256_64hex
    build_run_id_excluded: true
    archive_hash_excluded: true
    final_manifest_hash_excluded: true
    provenance_hash_excluded: true
    canonical_encoding: canonical_encoding:v1
    run_only_config_excluded:
      - workspace_path
      - output_location
      - log_level
      - timeout
      - diagnostic_retention_runs
    deterministic: true
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: archive_closure_valid
    kind: formula
    source: design/gdd/sys-build.md
    expression: "test_only_count == 0 and network_dependency_count == 0 and telemetry_entry_count == 0 and unallowlisted_asset_count == 0 and undeclared_asset_count == 0 and production_to_test_only_edge_count == 0 and legal_asset_valid and archive_hash_valid"
    variables:
      - test_only_count
      - network_dependency_count
      - telemetry_entry_count
      - unallowlisted_asset_count
      - undeclared_asset_count
      - production_to_test_only_edge_count
      - legal_asset_valid
      - archive_hash_valid
    output: exact_bool
    failure_on_any_nonzero_count: true
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: release_gate_pass
    kind: formula
    source: design/gdd/sys-build.md
    expression: "source_manifest_valid and journal_bundle_valid and staging_evidence_bound and archive_evidence_bound and candidate_identity_match and environment_match and package_runner_success and archive_closure_valid and legal_asset_valid and archive_hash_valid"
    variables:
      - source_manifest_valid
      - journal_bundle_valid
       - staging_evidence_bound
       - archive_evidence_bound
      - candidate_identity_match
      - environment_match
      - package_runner_success
      - archive_closure_valid
      - legal_asset_valid
      - archive_hash_valid
    output: exact_bool
    aggregation: strict_and
    partial_pass: forbidden
    referenced_by:
      - SYS-BUILD
      - SYS-TEST

  - name: build_runner_timeout_ms
    kind: tuning_knob
    source: design/gdd/sys-build.md
    target: 600000
    safe_range: [60000, 3600000]
    unit: milliseconds
    provisional: true
    provisional_reason: BUILD-Q1
    timeout_result: FAILED/TIMEOUT
    gate_reduction: forbidden
    referenced_by:
      - SYS-BUILD

  - name: diagnostic_retention_runs
    kind: tuning_knob
    source: design/gdd/sys-build.md
    target: 5
    safe_range: [1, 20]
    unit: non_release_diagnostic_runs
    release_artifact_deletion: forbidden
    referenced_by:
      - SYS-BUILD

  - name: journal_catalog_bundle_v1
    kind: constant
    source: design/gdd/sys-journal.md
    value: "journal_catalog_bundle:v1"
    schema_owner: SYS-JOURNAL
    assembler_owner: SYS-JOURNAL
    execution_owner: SYS-BUILD
    referenced_by:
      - SYS-JOURNAL
      - SYS-BUILD
