        comparators: [at_least]
        expected_int: [1, 2, 3]
        required_truth_value: true
      history_choice: {comparators: [present, absent], expected_int: null, required_truth_value: true}
      unresolved_token: {comparators: [present, absent], expected_int: null, required_truth_value: true}
      completed_event: {comparators: [present, absent], expected_int: null, required_truth_value: true}
      resource_possession: {comparators: [present, absent], expected_int: null, required_truth_value: true}
      route_qualification: {comparators: [present, absent], expected_int: null, required_truth_value: true}
      constant: {comparators: [always_true], expected_int: null, required_truth_value: true, ending_id: unsent_postcard}
    clause_order:
      exact_type: int
      per_ending_domain: contiguous_zero_to_n_minus_one
      unique_per_ending: true
      root_order: 0
    operands: same_ending_only_sorted_by_clause_order
    graph_shape: exactly_one_root_acyclic_tree_no_shared_children
    all_required_truth_value: true
    group_evaluation: complete_all_children_without_short_circuit
    contributor_rule: complete_true_support_for_match_complete_false_support_for_exclusion
