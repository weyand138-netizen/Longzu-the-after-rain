      - SYS-ACCESS
      - SYS-TEST

  - name: journal_read_model_valid
    kind: formula
    source: design/gdd/sys-journal.md
    expression: >-
      the detached SYS-PERSIST snapshot is valid; all four content catalogs
      have exact schemas and matching generations; chapter and memory IDs
      exact-equal the approved memory IDs; achievement and ending IDs
      exact-equal their approved canonical sets; and every catalog reference
      resolves exactly once
    variables:
      - detached_snapshot
      - content_catalog_bundle
      - persist_snapshot_valid
      - catalog_generation_ids
      - catalog_reference_counts
    output: exact_bool
    false_result_policy: no_normal_category_read_model_or_zero_count
    referenced_by:
      - SYS-JOURNAL
      - SYS-ACCESS
      - SYS-TEST

  - name: visible_ordered_ids
    kind: formula
    source: design/gdd/sys-journal.md
    expression: >-
      select the category membership from the valid detached snapshot,
      intersect it with the approved category catalog, and apply the category's
      deterministic display order; chapter and memory share memory membership
      but resolve to different player-safe content views
    variables:
      - detached_snapshot
      - content_catalog_bundle
      - journal_category
      - category_display_order
    output: exact_tuple_of_unique_approved_ids
    output_count_range_by_category:
      chapter: [0, 7]
      memory: [0, 7]
      achievement: [0, 11]
      ending: [0, 6]
    requires_journal_read_model_valid: true
    referenced_by:
      - SYS-JOURNAL
      - SYS-ACCESS
      - SYS-TEST

  - name: journal_session_new_ids
    kind: formula
    source: design/gdd/sys-journal.md
    expression: >-
      at journal-open-cycle start use the display-ordered unseen achievement
      IDs; after each valid refresh, stable-union the current cycle IDs with
      the refreshed unseen IDs, intersect with refreshed visible achievement
      membership, and reapply approved achievement display order
    variables:
      - opening_unseen_achievement_ids
      - current_cycle_new_ids
      - refreshed_detached_snapshot
      - refreshed_visible_achievement_ids
      - achievement_display_order
    output: cycle_only_exact_tuple_of_approved_achievement_ids
    output_count_range: [0, 11]
    cleared_on_journal_close_or_recovery_handoff: true
    durable_mark_seen_removes_during_current_cycle: false
    referenced_by:
      - SYS-JOURNAL
      - SYS-ACHIEVE
      - SYS-PERSIST
      - SYS-ACCESS
      - SYS-TEST

  - name: journal_seen_ack_ids
    kind: formula
    source: design/gdd/sys-journal.md
    expression: >-
      return the canonical-UTF8-ordered upstream unseen achievement IDs only
      when the journal read model is valid, the complete achievement list has
      been successfully presented and the current list version has not already
      submitted acknowledgement; otherwise return an empty tuple
    variables:
      - detached_snapshot
      - presentation_success
      - submission_latch
      - journal_read_model_valid
      - canonical_utf8_order
    output: exact_tuple_of_unique_approved_achievement_ids
    output_count_range: [0, 11]
    nonempty_submission_limit_per_list_version: 1
    empty_tuple_submits_request: false
    referenced_by:
      - SYS-JOURNAL
      - SYS-ACHIEVE
      - SYS-PERSIST
      - SYS-TEST

  - name: journal_visible_count
    kind: formula
    source: design/gdd/sys-journal.md
    expression: >-
      the length of visible_ordered_ids for the requested category when the
      complete journal read model is valid
    variables:
      - visible_ordered_ids
      - journal_category
    output: exact_nonnegative_int
    output_range_by_category:
      chapter: [0, 7]
      memory: [0, 7]
      achievement: [0, 11]
      ending: [0, 6]
    player_visible_count_category: achievement_only
    denominator_or_percentage_display: forbidden
    invalid_or_unavailable_output: none
    referenced_by:
      - SYS-JOURNAL
      - SYS-ACCESS
      - SYS-TEST

  - name: journal_restore_focus
    kind: formula
    source: design/gdd/sys-journal.md
    expression: >-
      return the first valid semantic focus ID in the frozen candidate order:
      previous target, section return, corresponding contents entry, caller
      fallback
    variables:
      - valid_focus_target_ids
      - previous_focus_id
      - section_return_id
      - contents_entry_id
      - caller_fallback_id
    output: exactly_one_valid_semantic_focus_id
    candidate_priority:
      - previous_focus_id
      - section_return_id
      - contents_entry_id
      - caller_fallback_id
    empty_target_or_missing_fallback_policy: contract_validation_failure
    displayable_guessing: forbidden
    referenced_by:
      - SYS-JOURNAL
      - SYS-ACCESS
      - SYS-TEST

  - name: tension_mode_enabled
    kind: setting
    source: design/gdd/sys-tension.md
    owner: SYS-TENSION
    type: exact_bool
    default: false
    persists_across:
      - application_restart
      - new_game
    excluded_from:
      - per_run_save_restore
      - rollback
    invalid_or_unavailable_effective_value: false
    scope: post_mvp_deferred
    current_production_gate: excluded
    storage_mechanism_status: deferred_pending_post_mvp_adr
    current_persistent_contract_inclusion: false
    current_sys_persist_leaf_addition: forbidden
    sys_persist_12_leaf_5_setting_root_amendment_without_approval: forbidden
    referenced_by:
      - SYS-TENSION
      - SYS-ACCESS
      - SYS-NARRATIVE
      - SYS-SAVE
      - SYS-TEST

  - name: tension_state_lifecycle
    kind: lifecycle_contract
    source: design/gdd/sys-tension.md
    states:
      - Disabled
      - Validating
      - Presenting
      - Running
      - Paused
      - ResolvingConfirmed
      - ResolvingTimeout
      - HandedOff
      - FallbackUntimed
      - Closed
    resolution_states_mutually_exclusive: true
    fallback_after_resolution_latch: forbidden
    timer_ownership_after_handoff: none
    referenced_by:
      - SYS-TENSION
      - SYS-ACCESS
      - SYS-SAVE
      - SYS-TEST

  - name: tension_scene_manifest_fields
    kind: schema
    source: design/gdd/sys-tension.md
    value:
      - scene_id
      - timed_choice_surface
      - non_timed_choice_surface
      - duration_configuration
      - timeout_choice_id
      - accessible_time_bindings
      - timed_only_affordance_delta
      - narrative_eligibility_record_id
    raw_declaration_count_per_scene: exactly_one
    timed_non_timed_choice_sequence: exact_match
    timeout_choice_manual_reachability: required
    invalid_runtime_policy_before_resolution_latch: fallback_untimed_without_semantic_write
    referenced_by:
      - SYS-TENSION
      - SYS-CHOICE
      - SYS-NARRATIVE
      - SYS-ACCESS
      - SYS-TEST

  - name: tension_narrative_eligibility_record
    kind: schema
    source: design/gdd/sys-tension.md
    owner: SYS-NARRATIVE
    value:
      - scene_id
      - diegetic_deadline_id
      - decision_context_summary_id
      - decision_information_complete
      - agency_answer_state
      - agency_answer_determined_or_not_applicable
      - timeout_causal_bridge_id
      - min_intervening_narrative_event_count
      - next_player_choice_id
      - reviewer_ids
      - source_hash
    agency_answer_determined_or_not_applicable: derived_not_authorable
    validity_expression: "unique_record and diegetic_deadline_valid and decision_information_complete and decision_context_summary_valid and agency_answer_determined_or_not_applicable and timeout_causal_bridge_valid and min_intervening_narrative_event_count >= 1 and next_player_choice_valid and terminal_policy_valid and reviewer_pair_valid and source_hash_current"
    non_agency_answer_state: not_applicable
    agency_answer_forbidden_states:
      - undetermined
      - not_applicable
    reviewer_roles_exact:
      - Narrative Director
      - Creative Director
    reviewer_canonical_person_count: exactly_two_distinct
    source_hash: lowercase_sha256_64hex
    source_hash_covers:
      - scene_declaration
      - paired_surfaces
      - decision_summary
      - answer_state
      - causal_bridge
      - continuation_witness
    referenced_by:
      - SYS-TENSION
      - SYS-NARRATIVE
      - SYS-CHOICE
      - SYS-TEST

  - name: tension_initial_duration
    kind: formula
    source: design/gdd/sys-tension.md
    expression: "D = clamp((B + C / V + K * N) * P, D_min, D_max)"
    variables:
      - base_decision_seconds
      - readable_character_count
      - reading_chars_per_second
      - per_option_seconds
      - option_count
      - pressure_factor
      - minimum_duration_seconds
      - maximum_duration_seconds
    output: finite_float_seconds
    target_output_range: [18, 40]
    absolute_safe_output_range: [15, 50]
    dynamic_player_adaptation: forbidden
    referenced_by:
      - SYS-TENSION
      - SYS-NARRATIVE
      - SYS-ACCESS
      - SYS-TEST

  - name: tension_effective_paused_duration
    kind: formula
    source: design/gdd/sys-tension.md
    expression: "P_t = measure(union([s_i, min(e_i, t)] for each approved pause interval i))"
    variables:
      - pause_interval_starts
      - pause_interval_ends
      - current_monotonic_time
    output: finite_float_seconds
    output_range: [0, raw_elapsed_time]
    overlapping_pause_intervals: union_not_sum
    referenced_by:
      - SYS-TENSION
      - SYS-ACCESS
      - SYS-TEST

  - name: tension_remaining_time
    kind: formula
    source: design/gdd/sys-tension.md
    expression: "R(t) = clamp(D - ((t - t0) - P_t), 0, D)"
    variables:
      - initial_duration
      - timer_start_monotonic_time
      - current_monotonic_time
      - effective_paused_duration
    output: finite_float_seconds
    output_range: [0, initial_duration]
    expired_time_may_increase: false
    referenced_by:
      - SYS-TENSION
      - SYS-ACCESS
      - SYS-TEST

  - name: tension_warning_phase
    kind: formula
    source: design/gdd/sys-tension.md
    expression: "Q = R / D; stable if U < Q <= 1; urgent if H < Q <= U; critical if 0 < Q <= H; expired if Q = 0"
    variables:
      - remaining_time
      - initial_duration
      - urgent_threshold
      - critical_threshold
    output:
      - stable
      - urgent
      - critical
      - expired
    target_thresholds:
      urgent: 0.5
      critical: 0.2
    semantic_or_input_effect: forbidden
    referenced_by:
      - SYS-TENSION
      - SYS-ACCESS
      - SYS-AUDIO
      - SYS-TEST

  - name: tension_resolution
    kind: formula
    source: design/gdd/sys-tension.md
    expression: "reduce immutable snapshot by timestamp, state-event priority, activation priority, timeout priority, and receive_seq; confirmed wins at active_elapsed <= D only while Running; a self-voicing paused intent may be created only when frozen R_pause > 0; R_pause = 0 resumes to timeout"
    variables:
      - resolution_latch
      - activation_valid
      - activation_monotonic_time
      - validated_pause_intervals
      - state_events
      - receive_sequence
      - frozen_remaining_time_at_pause
      - deadline
      - confirmed_choice_id
      - timeout_choice_id
    output: unresolved_or_exact_registered_choice_id
    equal_deadline_priority: confirmed_choice
    equal_deadline_pause_start_priority: pause_state
    zero_remaining_paused_intent: forbidden
    zero_remaining_resume_result: timeout_choice
    successful_resolution_count: exactly_one
    referenced_by:
      - SYS-TENSION
      - SYS-CHOICE
      - SYS-STATE
      - SYS-ACCESS
      - SYS-TEST

  - name: tension_scene_manifest_valid
    kind: formula
    source: design/gdd/sys-tension.md
    expression: "unique_scene and exact_surface_pair and same_choice_sequence and same_initial_focus_rule and same_navigation_semantics and same_causal_projection and declared_affordance_delta and registered_timeout and timeout_manual_reachable and reaction_payoff_covered and readable_time_text_ready and noncolor_visual_time_state_ready and stable_focus_bound and direct_keyboard_activation_bound and narrative_eligibility_valid and duration_inputs_valid"
    variables:
      - unique_scene
      - exact_surface_pair
      - same_choice_sequence
      - same_initial_focus_rule
      - same_navigation_semantics
      - same_causal_projection
      - declared_affordance_delta
      - registered_timeout
      - timeout_manual_reachable
      - reaction_payoff_covered
      - readable_time_text_ready
      - noncolor_visual_time_state_ready
      - stable_focus_bound
      - direct_keyboard_activation_bound
      - narrative_eligibility_valid
      - duration_inputs_valid
    output: exact_bool
    false_runtime_policy_before_resolution_latch: fallback_untimed_without_semantic_write
    referenced_by:
      - SYS-TENSION
      - SYS-CHOICE
      - SYS-NARRATIVE
      - SYS-ACCESS
      - SYS-TEST

