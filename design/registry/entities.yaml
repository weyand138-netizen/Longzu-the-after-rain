      - SYS-SAVE
      - SYS-ACCESS
      - SYS-TEST

  - name: persist_batch_result
    kind: formula
    source: design/gdd/cross-playthrough-unlocks.md
    expression: >-
      REJECTED_INVALID when request or manifest is invalid;
      PERSISTENCE_UNAVAILABLE when root is invalid or recovery is active;
      REJECTED_REENTRANT when another operation owns the mutex;
      STALE_DRAFT_CONFLICT for conflicting setting bases; DUPLICATE_NOOP when
      the complete candidate equals current root; APPLIED_FLUSHED when the
      candidate differs and the canonical flush succeeds;
      PERSIST_FLUSH_FAILED_SAFE only for proven pre-write failure; otherwise
      COMMIT_STATUS_UNKNOWN
    variables:
      - current_root
      - validated_requests
      - complete_candidate
      - flush_success
    output:
      - REJECTED_INVALID
      - REJECTED_REENTRANT
      - DUPLICATE_NOOP
      - APPLIED_FLUSHED
      - STALE_DRAFT_CONFLICT
      - PERSIST_FLUSH_FAILED_SAFE
      - COMMIT_STATUS_UNKNOWN
      - PERSISTENCE_UNAVAILABLE
    referenced_by:
      - SYS-PERSIST
      - SYS-ACHIEVE
      - SYS-NARRATIVE
      - SYS-ENDING
      - SYS-ACCESS
      - SYS-TEST

  - name: persist_merge_valid
    kind: formula
    source: design/gdd/cross-playthrough-unlocks.md
    expression: >-
      when roots are valid and have identical schema and catalog generation,
      select the maximum collection epoch; only roots at that epoch
      contribute canonical membership and seen unions, while project settings
      use the newer valid source value; otherwise enter persistence safe
      recovery without selective salvage
    unlock_properties:
      - commutative
      - associative
      - idempotent
    output:
      - valid_merged_root
      - PERSISTENCE_SAFE_RECOVERY
    referenced_by:
      - SYS-PERSIST
      - SYS-ACCESS
      - SYS-TEST

