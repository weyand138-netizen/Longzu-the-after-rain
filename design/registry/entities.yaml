  - name: achievement_catalog_valid
    kind: formula
    source: design/gdd/local-achievements.md
    expression: >-
      exact eight-field record schema, exactly 11 unique approved v2 IDs,
      nonempty uniquely resolving conditions and witnesses, all operators set
      to all, all reveal policies set to ON_UNLOCK, SYS-ACHIEVE ownership,
      zero ending or memory mirrors and exact approved display order
    variables:
      - condition_catalog
      - approved_achievement_ids
      - completed_event_catalog
      - witness_catalog
      - ending_or_memory_mirror_count
      - locked_surface_count
    output: exact_bool
    referenced_by:
      - SYS-ACHIEVE
      - SYS-TEST

  - name: achievement_snapshot_valid
    kind: formula
    source: design/gdd/local-achievements.md
    expression: >-
      exact snapshot schema with matching generation and collection epoch,
      unclaimed occurrence and stable checkpoint; canonical valid
      completed/new event tuples; new events are the canonical tail of
      cumulative events and every new event maps to the checkpoint
    variables:
      - snapshot_generation_id
      - catalog_generation_id
      - snapshot_collection_epoch_id
      - root_collection_epoch_id
      - checkpoint_occurrence_id
      - checkpoint_id
      - completed_event_ids
      - newly_completed_event_ids
      - stable_completion_boundary
      - event_checkpoint_index
    output: exact_bool
    referenced_by:
      - SYS-ACHIEVE
      - SYS-NARRATIVE
      - SYS-ENDING
      - SYS-TEST

  - name: achievement_condition_satisfied
    kind: formula
    source: design/gdd/local-achievements.md
    expression: >-
      every required event is in the one derived cumulative event set; the
      launch catalog only permits the all operator
    variables:
      - achievement_condition_record
      - completed_event_ids
      - condition_event_ids
      - condition_operator
    output: exact_bool
    referenced_by:
      - SYS-ACHIEVE
      - SYS-TEST

  - name: achievement_grant_eligible_now
    kind: formula
    source: design/gdd/local-achievements.md
    expression: >-
      snapshot is valid, complete condition is satisfied, the causally last
      condition event is newly completed at this checkpoint, and achievement
      membership is absent
    variables:
      - achievement_condition_record
      - achievement_evidence_snapshot
      - canonical_achievement_ids
      - canonical_completion_event
    output: exact_bool
    historical_snapshot_backfill: forbidden
    referenced_by:
      - SYS-ACHIEVE
      - SYS-PERSIST
      - SYS-TEST

  - name: new_achievement_ids
    kind: formula
    source: design/gdd/local-achievements.md
    expression: >-
      UTF8-byte-sorted exact tuple of achievement IDs whose records are
      grant-eligible at the current stable checkpoint
    variables:
      - achievement_condition_catalog
      - achievement_evidence_snapshot
      - canonical_achievement_ids
    output: exact_tuple_of_approved_achievement_ids
    output_count_range: [0, 11]
    referenced_by:
      - SYS-ACHIEVE
      - SYS-PERSIST
      - SYS-TEST

  - name: achievement_unlock_requests
    kind: formula
    source: design/gdd/local-achievements.md
    expression: >-
      one canonical achievement unlock request per new ID, using the
      condition tuple's final event and that event's unique checkpoint
    variables:
      - new_achievement_ids
      - completion_event_map
      - event_checkpoint_index
      - catalog_generation_id
    output: exact_tuple_of_persistent_unlock_requests
    output_count_range: [0, 11]
    referenced_by:
      - SYS-ACHIEVE
      - SYS-PERSIST
      - SYS-TEST

  - name: achievement_presentation_decision
    kind: formula
    source: design/gdd/local-achievements.md
    expression: >-
      PRESENT in approved display order after durable success at a safe
      boundary; DEFER after durable success at an unsafe boundary; otherwise
      NO_PRESENTATION
    variables:
      - persistent_batch_result
      - durably_added_achievement_ids
      - safe_presentation_boundary
      - achievement_display_rank
    output:
      - PRESENT
      - DEFER
      - NO_PRESENTATION
    ending_or_memory_mirror_count: 0
    notification_policy: one_composed_notification_group
    referenced_by:
      - SYS-ACHIEVE
      - SYS-PERSIST
      - SYS-ACCESS
      - SYS-TEST

  - name: achievement_anti_proxy_valid
    kind: formula
    source: design/gdd/local-achievements.md
    expression: >-
      no forbidden condition edge, display token or locked pre-unlock
      surface; at least one zero-delta witness and one non-best-ending witness;
      display groups exact-match the approved narrative grouping
    variables:
      - forbidden_condition_edges
      - forbidden_display_tokens
      - locked_surface_count
      - zero_delta_witness_count
      - non_best_ending_witness_count
      - achievement_display_groups
    output: exact_bool
    referenced_by:
      - SYS-ACHIEVE
      - SYS-STATE
      - SYS-CHOICE
      - SYS-JOURNAL
      - SYS-TEST

