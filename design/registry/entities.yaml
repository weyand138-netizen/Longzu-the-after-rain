    kind: formula
    source: design/gdd/save-load-rollback.md
    expression: >-
      the expected checkpoint record is exact; restored control location,
      state sentinel, history, axes and ending lifecycle equal the saved
      checkpoint; the checkpoint/location join is valid; and the reused
      restored_traversal_occurrence_valid formula passes for the target choice,
      restored traversal and checkpoint kind
    variables:
      - expected_checkpoint_record
      - restored_snapshot
      - post_restore_trace
      - checkpoint_catalog
      - location_catalog
      - restored_traversal_occurrence_valid
    output: exact_bool
    persistent_state_in_equality: false
    persistent_invariance_assertion: required
    referenced_by:
      - SYS-SAVE
      - SYS-STATE
      - SYS-ENDING
      - SYS-CHOICE
      - SYS-NARRATIVE
      - SYS-TEST

  - name: save_action_allowed
