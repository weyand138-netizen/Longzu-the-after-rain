      both exact catalogs are nonempty and duplicate-free; every checkpoint
      record has exactly one location record and every location record has
      exactly one checkpoint record on control_location_id plus checkpoint_kind;
      all source hashes and engine statement identities are valid
    variables:
      - checkpoint_evidence_catalog
      - location_mapping_catalog
      - control_location_id
      - checkpoint_kind
      - source_artifact_hash
      - engine_statement_id
    output: exact_bool
    referenced_by:
      - SYS-SAVE
      - SYS-CHOICE
      - SYS-NARRATIVE
      - SYS-BUILD
      - SYS-TEST

