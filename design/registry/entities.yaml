  - name: ending_predicate_truth
    kind: formula
    source: design/gdd/deterministic-ending-resolution.md
    predicates:
      rain_stops: "understanding == 3 and autonomy == 3 and truth == 3 and preparation == 3 and sacrifice == 3 and unresolved_token_count == 0"
      her_own_name: "autonomy >= 3 and truth >= 3 and understanding >= 2 and qualification_independent_contact_route and no unresolved autonomy/truth token"
      see_the_sea: "autonomy >= 2 and preparation >= 2 and sacrifice >= 2 and understanding >= 1 and truth >= 1 and qualification_shared_escape_route and no unresolved autonomy/truth/sacrifice token"
      one_person_train: "qualification_solo_departure_route and (understanding <= 1 or preparation <= 1 or at least one unresolved understanding/preparation/truth token)"
      golden_cage: "qualification_old_order_return_route and at least one unresolved autonomy token"
      unsent_postcard: "always_true"
    output: exact_bool_per_ending
    domain_token_conditions_expand_to_exact_atomic_clauses: required
    referenced_by:
      - SYS-ENDING
      - SYS-NARRATIVE
      - SYS-TEST

