  - name: load_compatibility_result
    kind: formula
    source: design/gdd/save-load-rollback.md
    expression: >-
      LEGACY_INCOMPATIBLE if either sentinel is None; otherwise
      UNSUPPORTED_VERSION if either sentinel has a wrong exact type or unknown
      value without invoking state validation; otherwise CORRUPT_STATE if
      semantic or ending validation fails; otherwise
      UNSUPPORTED_CONTROL_LOCATION if the exact control-location match count is
      not one; otherwise CORRUPT_STATE if checkpoint coherence fails; otherwise
      SUPPORTED
    variables:
      - semantic_sentinel
      - ending_sentinel
      - semantic_state_valid
      - ending_lifecycle_valid
      - control_location_match_count
      - checkpoint_state_coherent
    output:
      - SUPPORTED
      - LEGACY_INCOMPATIBLE
      - UNSUPPORTED_VERSION
      - CORRUPT_STATE
      - UNSUPPORTED_CONTROL_LOCATION
    excludes_preload_result: UNREADABLE_SAVE
    referenced_by:
      - SYS-SAVE
      - SYS-STATE
      - SYS-ENDING
      - SYS-NARRATIVE
      - SYS-TEST

  - name: restore_checkpoint_join_valid
